# Source-build example for the ChangeRadar repository; see README.md for other repositories.
name: Deployment impact review

on:
  pull_request:

permissions:
  contents: read

jobs:
  changeradar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install and build ChangeRadar
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Analyze committed PR changes
        id: analyze
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI: 'true'
        run: |
          status=0
          node dist/cli.js analyze "$BASE_SHA...$HEAD_SHA" --format json > changeradar-report.json || status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Save the completed report, including HIGH findings
        if: ${{ !cancelled() && (steps.analyze.outputs.exit_code == '0' || steps.analyze.outputs.exit_code == '1') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: changeradar-report
          path: changeradar-report.json
          if-no-files-found: error
          retention-days: 7
